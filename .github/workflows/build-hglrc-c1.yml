name: Build HGLRC C1 ELRS firmware

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-hglrc-c1.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build official ExpressLRS targets for HGLRC C1
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p HGLRC-C1/firmware
          for VER in 3.0.1 3.3.1; do
            rm -rf /tmp/ExpressLRS
            git clone --depth 1 --branch "$VER" https://github.com/ExpressLRS/ExpressLRS.git /tmp/ExpressLRS
            cd /tmp/ExpressLRS/src
            pio run -e DIY_2400_TX_ESP32_SX1280_E28_via_UART
            cp ".pio/build/DIY_2400_TX_ESP32_SX1280_E28_via_UART/firmware.bin" "$GITHUB_WORKSPACE/HGLRC-C1/firmware/HGLRC-C1_ELRS-${VER}_DIY-ESP32-E28-2.4GHz-TX.bin"
          done
          cd "$GITHUB_WORKSPACE/HGLRC-C1/firmware"
          sha256sum *.bin > SHA256SUMS.txt

      - name: Commit firmware binaries
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HGLRC-C1/firmware
          if git diff --cached --quiet; then
            echo "No firmware changes"
          else
            git commit -m "Build HGLRC C1 ELRS 3.0.1 and 3.3.1 firmware"
            git push
          fi
